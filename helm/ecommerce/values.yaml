frontend:
  replicaCount: 1
  image:
    repository: ashikdv/ecommercefrontend
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
    targetPort: 80

backend:
  replicaCount: 1
  existingSecret: ecommerce-runtime-secret
  image:
    repository: ashikdv/ecommercebackend
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

jwt:
  issuer: "ECommerceBackend"
  audience: "ECommerceFrontend"
  expiryMinutes: 60

logging:
  provider: "Both"

email:
  enabled: true
  host: "smtp.gmail.com"
  port: 587
  enableSsl: true
  fromName: "ECommerce Store"

google:
  clientId: ""

ingress:
  enabled: true
  className: nginx
  host: ""
