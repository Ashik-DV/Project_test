apiVersion: v1
kind: Service
metadata:
  name: {{ include "ecommerce.fullname" . }}-backend
spec:
  type: {{ .Values.backend.service.type }}

  selector:
    app: {{ include "ecommerce.fullname" . }}-backend

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.targetPort }}