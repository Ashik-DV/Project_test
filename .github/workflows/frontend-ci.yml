name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - 'ECommerceApp/ECommerceFrontend/**'

  pull_request:
    branches:
      - main
    paths:
      - 'ECommerceApp/ECommerceFrontend/**'

  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  ACR_NAME: ecomlabuou1fc
  ACR_LOGIN_SERVER: ecomlabuou1fc.azurecr.io

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ECommerceApp/ECommerceFrontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ECommerceApp/ECommerceFrontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Azure login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          az acr login --name "$ACR_NAME"

      - name: Build and push image to ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker build \
            -t "$ACR_LOGIN_SERVER/ecommercefrontend:${{ github.sha }}" \
            .
          docker push "$ACR_LOGIN_SERVER/ecommercefrontend:${{ github.sha }}"

      - name: Update Helm image tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git switch main
          git pull --rebase origin main

          python - <<'PY'
          from pathlib import Path

          tag = "${{ github.sha }}"
          for name in ("infrastructure/dev/values.yaml", "infrastructure/prod/values.yaml"):
              path = Path(name)
              text = path.read_text()
              lines = text.splitlines()
              in_frontend = False
              changed = False
              for index, line in enumerate(lines):
                  if line.startswith("frontend:"):
                      in_frontend = True
                  elif line and not line.startswith((" ", "\t")):
                      in_frontend = False
                  elif in_frontend and line.strip().startswith("tag:"):
                      indent = line[:len(line) - len(line.lstrip())]
                      lines[index] = f"{indent}tag: {tag}"
                      changed = True
              if changed:
                  path.write_text("\n".join(lines) + "\n")
          PY

          git add infrastructure/dev/values.yaml infrastructure/prod/values.yaml
          if git diff --cached --quiet; then
            echo "No Helm image tag change."
          else
            git commit -m "chore(frontend): deploy ${{ github.sha }} [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi