name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - 'Ecommerce/Frontend/**'

  pull_request:
    branches:
      - main
    paths:
      - 'Ecommerce/Frontend/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Ecommerce/Frontend

    steps:

      # 1. Get source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Ecommerce/Frontend/package-lock.json

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Run lint
      - name: Run lint
        run: npm run lint

      # 5. Build React application
      - name: Build application
        run: npm run build

      # 6. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # 7. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ashikdv/ecommercefrontend:${{ github.sha }} \
            -t ashikdv/ecommercefrontend:latest \
            .

      # 8. Push Docker image
      - name: Push Docker image
        run: |
          docker push ashikdv/ecommercefrontend:${{ github.sha }}
          docker push ashikdv/ecommercefrontend:latest